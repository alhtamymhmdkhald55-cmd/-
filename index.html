<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشغل برو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--card:#fff;--ink:#14213D;--muted:#6B7A93;--line:#E1E7F0;--acc:#FF5A3C;--acc2:#FF8A5C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1017;--card:#161C27;--ink:#EDF1F8;--muted:#8A97AD;--line:#242D3D}}
:root[data-theme="dark"]{--bg:#0C1017;--card:#161C27;--ink:#EDF1F8;--muted:#8A97AD;--line:#242D3D}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header h1{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px}
header h1 i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.add{background:var(--acc);color:#fff;font-weight:700;padding:9px 16px;border-radius:99px;font-size:14px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 12px 12px;overflow-y:auto}
@media (min-width:860px){main{flex-direction:row;align-items:flex-start;padding:0 20px 20px}.stage{flex:1}.pl{width:320px;max-height:calc(100vh - 90px);overflow-y:auto}}

.stage{background:#000;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:16/9;width:100%;max-height:72vh;user-select:none}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfd8e6;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,#1c2535,#05070b)}
.empty .big{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:32px;color:#fff;padding-inline-start:5px}
.empty h2{font-size:20px;font-weight:800;color:#fff}
.empty p{font-size:14px;opacity:.8}
.ctl{position:absolute;inset-inline:0;bottom:0;padding:28px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;transition:opacity .25s;direction:ltr}
.stage.idle .ctl{opacity:0;pointer-events:none}
.stage.idle{cursor:none}
.seek{display:flex;align-items:center;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:linear-gradient(to right,var(--acc) var(--p,0%),rgba(255,255,255,.3) var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;flex-wrap:wrap;gap:2px}
.ib.act{background:var(--acc)}
video::cue{font-family:Tajawal,sans-serif;font-size:1.15em;background:rgba(0,0,0,.65)}
.zl,.zr{position:absolute;top:0;bottom:70px;width:35%}.zl{left:0}.zr{right:0}
.grp{display:flex;align-items:center;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.ib:hover{background:rgba(255,255,255,.15)}
.ib svg{width:24px;height:24px}
.ib.play{width:50px;height:50px;background:var(--acc)}
.ib.play:hover{background:var(--acc2)}
.vol{width:80px;flex:none}
.spd{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;border:0}
.spd option{color:#000}
.flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:12px 22px;font-weight:800;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;direction:rtl}
.flash.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

.info{padding:2px 4px}
.info h3{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.info p{font-size:13px;color:var(--muted);margin-top:2px}
.pl{background:var(--card);border-radius:20px;padding:12px;border:1px solid var(--line)}
.pl h4{font-size:15px;font-weight:800;padding:2px 6px 10px;display:flex;justify-content:space-between}
.pl h4 span{color:var(--muted);font-weight:500;font-size:13px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:8px;border-radius:14px}
.item:hover{background:var(--bg)}
.item.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.th{width:84px;aspect-ratio:16/9;border-radius:10px;background:#111;flex:none;overflow:hidden;position:relative}
.th canvas,.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;bottom:3px;left:4px;background:rgba(0,0,0,.75);color:#fff;font-size:10.5px;padding:1px 5px;border-radius:5px;direction:ltr}
.item .t{flex:1;min-width:0}
.item .t div{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.item .t small{color:var(--muted);font-size:12px}
.item .x{color:var(--muted);width:30px;height:30px;border-radius:50%;flex:none}
.item .x:hover{background:var(--line)}
.none{padding:18px 8px;text-align:center;color:var(--muted);font-size:14px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 10px 8px}
.drop{outline:3px dashed var(--acc);outline-offset:-8px}
</style>
</head>
<body>
<header>
  <h1><i>▶</i> مشغل برو</h1>
  <button class="add" id="add">+ إضافة فيديوهات</button>
</header>
<input type="file" id="file" accept="video/*,audio/*" multiple hidden>
<input type="file" id="subf" accept=".srt,.vtt" hidden>

<main id="main">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
    <div class="stage" id="stage">
      <video id="v" playsinline></video>
      <div class="empty" id="empty">
        <div class="big">▶</div>
        <h2>اختر فيديو من جهازك</h2>
        <p>اضغط "إضافة فيديوهات" أو اسحب الملفات وأفلتها هنا</p>
      </div>
      <div class="zl" id="zl"></div><div class="zr" id="zr"></div>
      <div class="flash" id="flash"></div>
      <div class="ctl" id="ctl">
        <div class="seek"><span id="cur">0:00</span><input type="range" id="bar" min="0" max="1000" value="0" aria-label="شريط التقدم"><span id="dur">0:00</span></div>
        <div class="row">
          <div class="grp">
            <button class="ib" id="prev" aria-label="السابق"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
            <button class="ib" id="b10" aria-label="رجوع 10 ثوانٍ">⟲10</button>
            <button class="ib play" id="pp" aria-label="تشغيل"><svg viewBox="0 0 24 24" fill="currentColor" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="ib" id="f10" aria-label="تقديم 10 ثوانٍ">10⟳</button>
            <button class="ib" id="next" aria-label="التالي"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 19V5l9.5 7z"/></svg></button>
          </div>
          <div class="grp">
            <button class="ib" id="mute" aria-label="كتم"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
            <input type="range" class="vol" id="vol" min="0" max="100" value="100" aria-label="الصوت">
            <button class="ib" id="cc" aria-label="ترجمة">CC</button>
            <button class="ib" id="lp" aria-label="تكرار">🔁</button>
            <button class="ib" id="fit" aria-label="حجم العرض">⤢</button>
            <button class="ib" id="pip" aria-label="نافذة عائمة">⧉</button>
            <select class="spd" id="spd" aria-label="السرعة"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
            <button class="ib" id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <div class="info"><h3 id="title">لا يوجد فيديو</h3><p id="meta">اختر ملفاً لبدء التشغيل</p></div>
    <div class="hint">اضغط مرتين على يمين/يسار الشاشة لتقديم/تأخير 10 ثوانٍ · CC لإضافة ترجمة SRT أو VTT</div>
  </div>
  <aside class="pl">
    <h4>قائمة التشغيل <span id="cnt">0</span></h4>
    <div id="list"><div class="none">القائمة فارغة</div></div>
  </aside>
</main>

<script>
const $=s=>document.querySelector(s);
const v=$('#v'),stage=$('#stage');
let items=[],idx=-1;
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(c).padStart(2,'0')};
const key=f=>'vp:'+f.name+':'+f.size;
function store(k,val){try{localStorage.setItem(k,val)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function addFiles(fs){
  [...fs].filter(f=>/^(video|audio)\//.test(f.type)||/\.(mp4|mkv|webm|mov|m4v|mp3|ogg|wav)$/i.test(f.name)).forEach(f=>{
    const it={f,url:URL.createObjectURL(f),dur:0,thumb:null};
    items.push(it);thumbOf(it);
  });
  draw();
  if(idx<0&&items.length)play(0);
}
function thumbOf(it){
  const t=document.createElement('video');t.muted=true;t.preload='metadata';t.src=it.url;
  t.onloadedmetadata=()=>{it.dur=t.duration;t.currentTime=Math.min(1,t.duration/4||0)};
  t.onseeked=()=>{try{const c=document.createElement('canvas');c.width=160;c.height=90;c.getContext('2d').drawImage(t,0,0,160,90);it.thumb=c.toDataURL('image/jpeg',.6)}catch(e){}draw();t.removeAttribute('src');t.load()};
  t.onerror=()=>draw();
}
function draw(){
  $('#cnt').textContent=items.length;
  $('#list').innerHTML=items.length?'':'<div class="none">القائمة فارغة</div>';
  items.forEach((it,i)=>{
    const b=document.createElement('button');b.className='item'+(i===idx?' on':'');
    const saved=+load(key(it.f))||0;
    b.innerHTML=`<div class="th">${it.thumb?`<img alt="" src="${it.thumb}">`:''}${it.dur?`<b>${fmt(it.dur)}</b>`:''}</div><div class="t"><div></div><small>${(it.f.size/1048576).toFixed(1)} MB${saved>5?' · تابع من '+fmt(saved):''}</small></div><span class="x" role="button" aria-label="حذف" style="display:grid;place-items:center">✕</span>`;
    b.querySelector('.t div').textContent=it.f.name.replace(/\.[^.]+$/,'');
    b.onclick=e=>{if(e.target.classList.contains('x')){remove(i);return}play(i)};
    $('#list').appendChild(b);
  });
}
function remove(i){
  URL.revokeObjectURL(items[i].url);items.splice(i,1);
  if(i===idx){v.pause();v.removeAttribute('src');v.load();idx=-1;$('#empty').style.display='flex';$('#title').textContent='لا يوجد فيديو';$('#meta').textContent='اختر ملفاً لبدء التشغيل';if(items.length)return play(Math.min(i,items.length-1))}
  else if(i<idx)idx--;
  draw();
}
function play(i){
  idx=i;const it=items[i];
  v.src=it.url;$('#empty').style.display='none';
  $('#title').textContent=it.f.name.replace(/\.[^.]+$/,'');
  $('#meta').textContent=`${i+1} من ${items.length} · ${(it.f.size/1048576).toFixed(1)} MB`;
  v.playbackRate=+$('#spd').value;
  const saved=+load(key(it.f))||0;
  v.onloadedmetadata=()=>{if(saved>5&&saved<v.duration-5){v.currentTime=saved;flash('تابع من '+fmt(saved))}};
  v.play().catch(()=>{});draw();
}
const go=d=>{if(!items.length)return;play((idx+d+items.length)%items.length)};
function flash(t){const f=$('#flash');f.textContent=t;f.classList.add('on');clearTimeout(f._t);f._t=setTimeout(()=>f.classList.remove('on'),900)}
const toggle=()=>{if(!v.src)return;v.paused?v.play():v.pause()};
const skip=s=>{if(!v.src)return;v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+s));flash((s>0?'+':'−')+Math.abs(s)+' ث')};

$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#pp').onclick=toggle;v.onclick=toggle;
$('#b10').onclick=()=>skip(-10);$('#f10').onclick=()=>skip(10);
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
$('#spd').onchange=e=>{v.playbackRate=+e.target.value;flash(e.target.value+'x')};
$('#vol').oninput=e=>{v.volume=e.target.value/100;v.muted=false};
$('#mute').onclick=()=>{v.muted=!v.muted;flash(v.muted?'مكتوم':'الصوت يعمل')};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():(stage.requestFullscreen||stage.webkitRequestFullscreen||(()=>{})).call(stage);
v.onplay=v.onpause=()=>{$('#ppi').innerHTML=v.paused?'<path d="M8 5v14l11-7z"/>':'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'};
let last=0;
v.ontimeupdate=()=>{
  const p=v.duration?v.currentTime/v.duration*1000:0;
  $('#bar').value=p;$('#bar').style.setProperty('--p',p/10+'%');
  $('#cur').textContent=fmt(v.currentTime);$('#dur').textContent=fmt(v.duration);
  if(idx>=0&&Date.now()-last>2000){last=Date.now();store(key(items[idx].f),v.currentTime)}
};
$('#bar').oninput=e=>{if(v.duration)v.currentTime=e.target.value/1000*v.duration};
v.onended=()=>{if(idx<items.length-1)go(1)};
v.onerror=()=>{if(v.src)flash('صيغة غير مدعومة')};

/* auto-hide controls */
let idle;const wake=()=>{stage.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>{if(!v.paused)stage.classList.add('idle')},2500)};
['mousemove','touchstart','click'].forEach(e=>stage.addEventListener(e,wake));
v.addEventListener('pause',wake);

/* keyboard */
addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName)&&e.target.type!=='range')return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();toggle()}
  else if(k==='arrowleft'){skip(-5)}
  else if(k==='arrowright'){skip(5)}
  else if(k==='f'){$('#fs').click()}
  else if(k==='m'){$('#mute').click()}
});

/* drag and drop */
['dragover','dragenter'].forEach(e=>addEventListener(e,ev=>{ev.preventDefault();$('#main').classList.add('drop')}));
['dragleave','drop'].forEach(e=>addEventListener(e,ev=>{ev.preventDefault();$('#main').classList.remove('drop')}));
addEventListener('drop',e=>addFiles(e.dataTransfer.files));

/* ===== pro features ===== */
// double-tap to seek
function dbl(el,sec){let t=0;el.addEventListener('click',e=>{const n=Date.now();if(n-t<320){skip(sec);t=0;e.stopPropagation()}else t=n});}
dbl($('#zl'),-10);dbl($('#zr'),10);
// single tap on side zones toggles play after delay
['zl','zr'].forEach(id=>$('#'+id).addEventListener('click',()=>{clearTimeout(window._st);window._st=setTimeout(toggle,330)}));
['zl','zr'].forEach(id=>$('#'+id).addEventListener('dblclick',()=>clearTimeout(window._st)));
// loop
$('#lp').onclick=()=>{v.loop=!v.loop;$('#lp').classList.toggle('act',v.loop);flash(v.loop?'تكرار مفعّل':'تكرار متوقف')};
// fit modes
const fits=[['contain','ملائم'],['cover','ملء الشاشة'],['fill','تمديد']];let fi=0;
$('#fit').onclick=()=>{fi=(fi+1)%3;v.style.objectFit=fits[fi][0];flash(fits[fi][1])};
// picture in picture
$('#pip').onclick=async()=>{try{document.pictureInPictureElement?await document.exitPictureInPicture():await v.requestPictureInPicture()}catch(e){flash('غير مدعوم')}};
// subtitles (.srt / .vtt)
function srt2vtt(t){return 'WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2')}
$('#cc').onclick=()=>{if(!v.src)return flash('اختر فيديو أولاً');
  const tr=v.querySelector('track');
  if(tr){tr.remove();$('#cc').classList.remove('act');flash('الترجمة متوقفة');return}
  $('#subf').click()};
$('#subf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let t=await f.text();if(!/^WEBVTT/.test(t.trim()))t=srt2vtt(t);
  const tr=document.createElement('track');tr.kind='subtitles';tr.default=true;tr.label=f.name;tr.srclang='ar';
  tr.src=URL.createObjectURL(new Blob([t],{type:'text/vtt'}));
  v.querySelectorAll('track').forEach(x=>x.remove());v.appendChild(tr);
  tr.addEventListener('load',()=>{tr.track.mode='showing'});tr.track.mode='showing';
  $('#cc').classList.add('act');flash('تم تحميل الترجمة')};
// remove subtitles when changing video
const _play=play;play=function(i){v.querySelectorAll('track').forEach(x=>x.remove());$('#cc').classList.remove('act');_play(i)};
// media session (lock screen controls)
if('mediaSession' in navigator){['play','pause'].forEach(a=>navigator.mediaSession.setActionHandler(a,toggle));
 navigator.mediaSession.setActionHandler('previoustrack',()=>go(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>go(1));}
// extra shortcuts
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='l')$('#lp').click();else if(k==='c')$('#cc').click();else if(k==='p'&&e.shiftKey)$('#pip').click();else if(k==='arrowup'){v.volume=Math.min(1,v.volume+.1);$('#vol').value=v.volume*100;flash('🔊 '+Math.round(v.volume*100)+'%')}else if(k==='arrowdown'){v.volume=Math.max(0,v.volume-.1);$('#vol').value=v.volume*100;flash('🔉 '+Math.round(v.volume*100)+'%')}});
</script>
</body>
</html>
